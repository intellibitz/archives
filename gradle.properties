# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings
#
# .
# Allocate optimized memory to the Gradle & Kotlin Daemons
org.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -XX:+AlwaysPreTouch -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon
#org.gradle.jvmargs=-Xmx8g -Xms2g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.daemon.performance.disable-logging=true

# Increase memory for the Kotlin daemon
kotlin.daemon.jvm.options=-Xmx6g
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# Maximize parallel execution for multi-module builds
org.gradle.parallel=true
android.disallowKotlinSourceSets=false
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Enables the Gradle build cache, which speeds up builds by reusing outputs from previous builds.
org.gradle.caching=true
# Enables the file system watching, which speeds up builds by allowing Gradle to skip searching for changes.
org.gradle.vfs.watch=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Android SDK auto-download
android.auto-download=true
android.sdk.channel=0
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# AndroidX support
android.useAndroidX=true
android.enableJetifier=false

<svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1920" fill="black"/>

  <!-- Message Bubbles -->
  <g transform="translate(50, 200)">
    <rect width="400" height="120" rx="20" fill="#121212" stroke="#FFB300" stroke-width="1"/>
    <text x="20" y="40" fill="#FFB300" font-family="sans-serif" font-size="14" font-weight="bold">StadiumFan</text>
    <text x="20" y="80" fill="white" font-family="sans-serif" font-size="24">Is the match started?</text>
    <text x="360" y="105" fill="white" font-family="sans-serif" font-size="12" fill-opacity="0.5" text-anchor="end">21:10</text>
  </g>

  <g transform="translate(630, 350)">
    <rect width="400" height="120" rx="20" fill="#FFB300"/>
    <text x="20" y="60" fill="black" font-family="sans-serif" font-size="24">Not yet, almost!</text>
    <text x="360" y="105" fill="black" font-family="sans-serif" font-size="12" fill-opacity="0.5" text-anchor="end">21:11</text>
  </g>

  <!-- Input Field Mock -->
  <rect y="1770" width="1080" height="150" fill="#121212"/>
  <rect x="50" y="1800" width="850" height="90" rx="45" fill="black" stroke="#FFB300" stroke-width="1"/>
  <text x="100" y="1855" fill="white" font-family="sans-serif" font-size="24" fill-opacity="0.3">Type a message</text>
  <circle cx="1000" cy="1845" r="45" fill="#FFB300"/>
  <path d="M985 1845L1015 1845M1015 1845L1000 1830M1015 1845L1000 1860" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top Bar Mock -->
  <rect width="1080" height="150" fill="#121212"/>
  <text x="540" y="90" fill="#FFB300" font-family="sans-serif" font-size="40" font-weight="bold" text-anchor="middle">STADIUM LOBBY</text>
</svg>

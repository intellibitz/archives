litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: localhost
    port: 6379
    ttl: 86400
  drop_params: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  trusted_proxy_ranges: []
  dangerously_permit_weak_or_unset_master_key: true

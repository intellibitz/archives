# ==============================================================================
# Promptfoo Evaluation Suite: Gemini Pay-As-You-Go Benchmark (Live Models)
# ==============================================================================
description: "Gemini API Pay-As-You-Go Quality, Cost, and Latency Benchmark"

prompts:
  - "You are an autonomous principal software engineer. Analyze the following architectural objective and return a valid JSON object with keys 'architecture', 'token_strategy', and 'estimated_cost_tier':\n\n{{task}}"

providers:
  - id: "google:gemini-3.8-flash"
    label: "Gemini 3.8 Flash (PAYG Workhorse)"
    config:
      temperature: 0.1
  - id: "google:gemini-flash-latest"
    label: "Gemini Flash Latest"
    config:
      temperature: 0.1

tests:
  - vars:
      task: "Architect an autonomous Git and SQLite Model Context Protocol (MCP) server that utilizes prompt caching to minimize Pay-As-You-Go API costs."
    assert:
      - type: is-json
        metric: "ValidJSON"
      - type: javascript
        value: "output.includes('architecture') && output.includes('token_strategy')"
        metric: "KeyFieldsPresent"
      - type: latency
        threshold: 6000
        metric: "LatencyCeiling"

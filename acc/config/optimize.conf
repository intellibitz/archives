[Service]
# ---------- Model Lifecycle (Single-Model Focus) ----------
Environment="OLLAMA_KEEP_ALIVE=24h"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"

# ---------- Performance Knobs (Blazing Fast Mode) ----------
Environment="OLLAMA_NUM_THREADS=26"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_FLASH_ATTENTION=1"
# Reserve 1GB for OS/Desktop, rest for KV Cache offloading
Environment="OLLAMA_GPU_OVERHEAD=1024"
Environment="OLLAMA_USE_MMAP=1"
Environment="OLLAMA_CONTEXT_LENGTH=65536"
Environment="OLLAMA_MAX_QUEUE=1"

# ---------- Network ----------
Environment="OLLAMA_HOST=0.0.0.0:11434"

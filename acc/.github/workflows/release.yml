name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvmargs=-Xmx2g"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Fat JAR
        run: ./gradlew :gateway:shadowJar

      - name: Prepare Artifacts
        run: |
          mkdir -p release-artifacts
          cp gateway/build/libs/gateway-${{ steps.get_version.outputs.VERSION }}-all.jar release-artifacts/acc-gateway-${{ steps.get_version.outputs.VERSION }}.jar || cp gateway/build/libs/*.jar release-artifacts/
          cp LICENSE release-artifacts/

      - name: Determine if Pre-release
        id: check_prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *"-test."* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.jar
            release-artifacts/LICENSE
          prerelease: ${{ steps.check_prerelease.outputs.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
          body: |
            ## ACC Release ${{ github.ref_name }}
            
            Zero-effort execution:
            1. Download `acc-gateway-*.jar`
            2. Run with: `java -jar acc-gateway-*.jar`
            3. Open `http://localhost:8333` in your browser.
            
            *Automated release by ACC Build System.*

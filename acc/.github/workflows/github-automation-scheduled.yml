name: Scheduled GitHub Automation - Auto-fix & Auto-merge

permissions:
  contents: write
  pull-requests: write
  checks: write
  issues: write

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_tasks:
        description: 'Which tasks to run (all|fix|merge). Default: all'
        required: false
        default: 'all'
  push:
    tags:
      - 'automation/*'

jobs:
  automation:
    name: Auto-fix & Auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvmargs=-Xmx2g"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure required flags for destructive ops (defaults enabled)
        env:
          MAIN_RESET_CONFIRM: ${{ secrets.MAIN_RESET_CONFIRM != '' && secrets.MAIN_RESET_CONFIRM || 'true' }}
          FORCE_PUSH_CONFIRM: ${{ secrets.FORCE_PUSH_CONFIRM != '' && secrets.FORCE_PUSH_CONFIRM || 'true' }}
        run: |
          echo "MAIN_RESET_CONFIRM=${MAIN_RESET_CONFIRM}"
          echo "FORCE_PUSH_CONFIRM=${FORCE_PUSH_CONFIRM}"
          echo "Defaults are 'true' when secrets are not provided. Set repository secrets to 'false' to opt-out."

      - name: Preflight (gh auth and env checks)
        run: ./gradlew githubPreflight
        env:
          MAIN_RESET_CONFIRM: ${{ secrets.MAIN_RESET_CONFIRM != '' && secrets.MAIN_RESET_CONFIRM || 'true' }}
          FORCE_PUSH_CONFIRM: ${{ secrets.FORCE_PUSH_CONFIRM != '' && secrets.FORCE_PUSH_CONFIRM || 'true' }}
          GH_SKIP_AUTH_CHECK: ${{ secrets.GH_SKIP_AUTH_CHECK != '' && secrets.GH_SKIP_AUTH_CHECK || 'true' }}
          AUTO_RESOLVE_MANUAL: ${{ secrets.AUTO_RESOLVE_MANUAL != '' && secrets.AUTO_RESOLVE_MANUAL || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run auto-fix (update branches, rerun failed CI)
        if: ${{ github.event.inputs.run_tasks == 'all' || github.event.inputs.run_tasks == 'fix' }}
        run: ./gradlew githubFixAll
        env:
          MAIN_RESET_CONFIRM: ${{ secrets.MAIN_RESET_CONFIRM }}
          FORCE_PUSH_CONFIRM: ${{ secrets.FORCE_PUSH_CONFIRM }}
          GH_SKIP_AUTH_CHECK: ${{ secrets.GH_SKIP_AUTH_CHECK }}
          AUTO_RESOLVE_MANUAL: ${{ secrets.AUTO_RESOLVE_MANUAL != '' && secrets.AUTO_RESOLVE_MANUAL || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run auto-merge (update & enable auto-merge for mergeable PRs)
        if: ${{ github.event.inputs.run_tasks == 'all' || github.event.inputs.run_tasks == 'merge' }}
        run: ./gradlew githubMergeAll
        env:
          MAIN_RESET_CONFIRM: ${{ secrets.MAIN_RESET_CONFIRM }}
          FORCE_PUSH_CONFIRM: ${{ secrets.FORCE_PUSH_CONFIRM }}
          GH_SKIP_AUTH_CHECK: ${{ secrets.GH_SKIP_AUTH_CHECK }}
          AUTO_RESOLVE_MANUAL: ${{ secrets.AUTO_RESOLVE_MANUAL != '' && secrets.AUTO_RESOLVE_MANUAL || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove obsolete remote branches
        if: ${{ github.event.inputs.run_tasks == 'all' || github.event.inputs.run_tasks == 'merge' }}
        run: ./gradlew githubRemoveObsoleteBranches
        env:
          REMOVE_MODE: ${{ secrets.REMOVE_MODE != '' && secrets.REMOVE_MODE || 'true' }}
          REMOVE_DAYS: ${{ secrets.REMOVE_DAYS != '' && secrets.REMOVE_DAYS || '90' }}
          MAIN_RESET_CONFIRM: ${{ secrets.MAIN_RESET_CONFIRM }}
          FORCE_PUSH_CONFIRM: ${{ secrets.FORCE_PUSH_CONFIRM }}
          GH_SKIP_AUTH_CHECK: ${{ secrets.GH_SKIP_AUTH_CHECK }}
          AUTO_RESOLVE_MANUAL: ${{ secrets.AUTO_RESOLVE_MANUAL != '' && secrets.AUTO_RESOLVE_MANUAL || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup remote branches for merged PRs
        run: ./gradlew githubCleanupRemoteBranches
        env:
          DELETE_MODE: ${{ secrets.DELETE_REMOTE_BRANCHES != '' && secrets.DELETE_REMOTE_BRANCHES || 'true' }}
          MAIN_RESET_CONFIRM: ${{ secrets.MAIN_RESET_CONFIRM != '' && secrets.MAIN_RESET_CONFIRM || 'true' }}
          FORCE_PUSH_CONFIRM: ${{ secrets.FORCE_PUSH_CONFIRM != '' && secrets.FORCE_PUSH_CONFIRM || 'true' }}
          GH_SKIP_AUTH_CHECK: ${{ secrets.GH_SKIP_AUTH_CHECK != '' && secrets.GH_SKIP_AUTH_CHECK || 'true' }}
          AUTO_RESOLVE_MANUAL: ${{ secrets.AUTO_RESOLVE_MANUAL != '' && secrets.AUTO_RESOLVE_MANUAL || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune local branches on runner
        run: ./gradlew githubPruneLocalBranches
        env:
          PRUNE_LOCAL_MODE: ${{ secrets.PRUNE_LOCAL_BRANCHES != '' && secrets.PRUNE_LOCAL_BRANCHES || 'true' }}
          PRUNE_LOCAL_DAYS: ${{ secrets.PRUNE_LOCAL_DAYS != '' && secrets.PRUNE_LOCAL_DAYS || '90' }}
          MAIN_RESET_CONFIRM: ${{ secrets.MAIN_RESET_CONFIRM != '' && secrets.MAIN_RESET_CONFIRM || 'true' }}
          FORCE_PUSH_CONFIRM: ${{ secrets.FORCE_PUSH_CONFIRM != '' && secrets.FORCE_PUSH_CONFIRM || 'true' }}
          GH_SKIP_AUTH_CHECK: ${{ secrets.GH_SKIP_AUTH_CHECK != '' && secrets.GH_SKIP_AUTH_CHECK || 'true' }}
          AUTO_RESOLVE_MANUAL: ${{ secrets.AUTO_RESOLVE_MANUAL != '' && secrets.AUTO_RESOLVE_MANUAL || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build audit log
        if: always()
        run: |
          mkdir -p automation-audit
          echo "Timestamp: $(date -u)" > automation-audit/audit.txt
          echo "Event: ${{ github.event_name }}" >> automation-audit/audit.txt
          echo "Run tasks input: ${{ github.event.inputs.run_tasks || 'all' }}" >> automation-audit/audit.txt
          echo "MAIN_RESET_CONFIRM=${{ secrets.MAIN_RESET_CONFIRM != '' && secrets.MAIN_RESET_CONFIRM || 'true' }}" >> automation-audit/audit.txt
          echo "FORCE_PUSH_CONFIRM=${{ secrets.FORCE_PUSH_CONFIRM != '' && secrets.FORCE_PUSH_CONFIRM || 'true' }}" >> automation-audit/audit.txt
          echo "DELETE_REMOTE_BRANCHES=${{ secrets.DELETE_REMOTE_BRANCHES != '' && secrets.DELETE_REMOTE_BRANCHES || 'true' }}" >> automation-audit/audit.txt
          echo "PRUNE_LOCAL_BRANCHES=${{ secrets.PRUNE_LOCAL_BRANCHES != '' && secrets.PRUNE_LOCAL_BRANCHES || 'true' }}" >> automation-audit/audit.txt
          echo "AUTO_RESOLVE_MANUAL=${{ secrets.AUTO_RESOLVE_MANUAL != '' && secrets.AUTO_RESOLVE_MANUAL || 'true' }}" >> automation-audit/audit.txt
          echo "Merged PRs (recent):" >> automation-audit/audit.txt
          gh pr list --state merged --limit 50 --json number,title,mergedAt --jq '.[] | "#\(.number) \(.title) (merged: \(.mergedAt))"' >> automation-audit/audit.txt || true
          echo "Branches on remote (top 200):" >> automation-audit/audit.txt
          gh api repos/${{ github.repository }}/branches --jq '.[] | .name' | head -n 200 >> automation-audit/audit.txt || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-audit
          path: automation-audit

      - name: Report destructive actions
        if: always()
        run: |
          if grep -qE "Deleting remote branch|Deleting local branch|Reset will drop|will be lost" automation-audit/audit.txt; then
            TITLE="Automation alert: destructive actions"
            echo "Destructive actions detected. Looking for existing automation-alert issue to comment on..."
            EXISTING=$(gh issue list --label automation-alert --state open --json number -q '.[0].number' 2>/dev/null || true)
            if [ -n "${EXISTING}" ]; then
              echo "Commenting on existing issue #${EXISTING}"
              gh issue comment "${EXISTING}" --body-file automation-audit/audit.txt || echo "Failed to comment on issue ${EXISTING}"
            else
              echo "Creating new issue with label automation-alert"
              gh issue create --title "${TITLE}" --body-file automation-audit/audit.txt --label automation-alert || echo "Failed to create issue"
            fi
          else
            echo "No destructive actions detected."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

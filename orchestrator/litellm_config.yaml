    - local-reasoner
  - kimi-coder:
    - deepseek-coder
    - local-coder
  - kimi-architect:
    - antigravity-flash-latest
    - local-coder
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  dangerously_permit_weak_or_unset_master_key: true
  alerting: []
  store_model_in_db: false
litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 60
  cache: true
  cache_params:
    type: disk
    disk_cache_dir: "C:\\ProgramData\\litellm\\.cache"
    ttl: 86400
    default_in_memory_ttl: 86400
    supported_call_types:
      - "completion"
      - "acompletion"
      - "embedding"
      - "aembedding"










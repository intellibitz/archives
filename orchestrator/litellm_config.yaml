# SINGLE SOURCE OF TRUTH for the LiteLLM gateway.
# Edit here, then run: powershell -ExecutionPolicy Bypass -File orchestrator/deploy_litellm_config.ps1
# Do not hand-edit C:\ProgramData\litellm\config\config.yaml - it is generated.
#
# Route names cover both conventions in this repo:
#   flat provider names (ceo-cockpit: gemini-flash, siliconflow-qwen, deepseek-flash, ...)
#   role names         (orchestrator: antigravity-librarian, claude-architect, kimi-coder, ...)
#
# Removed 2026-10-30: dashscope-* (no DASHSCOPE_API_KEY), vertex-* (no GCP credentials).
#

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  cache_responses: true
litellm_settings:
  cache: true
  cache_params:
    type: disk
    disk_cache_dir: C:\ProgramData\litellm\.cache
    ttl: 86400
    default_in_memory_ttl: 86400
    supported_call_types:
    - completion
    - acompletion
    - embedding
    - aembedding
  drop_params: true
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  host: 0.0.0.0
  port: 4000
  trusted_proxy_ranges: []
  dangerously_permit_weak_or_unset_master_key: true
  database_connection_string: sqlite:///C:/ProgramData/litellm/litellm.db

router_settings:
  routing_strategy: cost-based-routing
  timeout: 60
  num_retries: 2
  allowed_fails: 1
  cooldown_time: 30
  cache_responses: true
  fallbacks:
  - gemini-payg:
    - gemini-3.8-flash
    - antigravity-flash-latest
    - local-coder
  - deepseek-coder:
    - local-coder
  - deepseek-reasoner:
    - antigravity-flash-latest
    - local-coder
  - claude-architect:

# PostgreSQL 17 + pgAdmin 4 Docker Compose Service
# Usage:
#   docker compose up -d
#   docker compose down

services:
  db:
    image: postgres:17-alpine
    container_name: intellibitz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "65432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  admin:
    image: dpage/pgadmin4:latest
    container_name: intellibitz-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@intellibitz.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "65430:80"
    volumes:
      - pgadmin:/var/lib/pgadmin

volumes:
  pgdata:
    name: intellibitz-pgdata
  pgadmin:
    name: intellibitz-pgadmin
